name: Fix Android Desugaring

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-android:
    runs-on: ubuntu-latest

    steps:
      - name: Get Nexora code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = text.replace(
              "targetCompatibility = JavaVersion.VERSION_17\n",
              "targetCompatibility = JavaVersion.VERSION_17\n"
              "        isCoreLibraryDesugaringEnabled = true\n"
          )

          marker = "kotlin {\n"
          dependency = '''dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }

          '''

          if "coreLibraryDesugaring(" not in text:
              text = text.replace(marker, dependency + marker)

          path.write_text(text)
          PY

      - name: Commit Android fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle.kts
          git diff --cached --quiet || git commit -m "Enable Android core library desugaring"
          git push
